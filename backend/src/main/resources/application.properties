# Server Configuration
server.port=${PORT:8080}

# PostgreSQL Database Configuration (env-var driven; local defaults match docker-compose.yml).
# DB_PORT defaults to 5433 to avoid clashing with a native Postgres install on 5432 —
# Render always sets DB_HOST/DB_PORT/DB_NAME explicitly so this default is dev-only.
# DB_SSLMODE=require is needed for managed providers like Neon/Supabase; local/Render-internal
# Postgres doesn't need it, hence the "disable" default.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:quiz_app_db}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:quiz_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:quiz_app}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Email Configuration (using mock by default)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:your-email@gmail.com}
spring.mail.password=${SMTP_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Set to true to use mock email (no real SMTP needed)
app.email.mock=${APP_EMAIL_MOCK:true}

# JWT Configuration
# app.jwt.secret MUST be overridden via env var in any real deployment (>=32 bytes for HS256)
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-please-32bytes-min}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS - comma-separated list of allowed frontend origins
app.cors.allowed-origins=${APP_CORS_ORIGIN:http://localhost:3000}
