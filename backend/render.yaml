services:
  - type: web
    name: online-quiz-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Points at an external Postgres instance (e.g. Neon, Supabase) — Render's own free-tier
      # database is already used by another project on this account. Set these values in the
      # Render dashboard (Environment tab); they are intentionally not committed here.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: APP_EMAIL_MOCK
        value: "true"
      # Update after the Vercel frontend is deployed, e.g. https://your-app.vercel.app
      - key: APP_CORS_ORIGIN
        value: http://localhost:3000
